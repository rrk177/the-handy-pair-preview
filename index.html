<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Handy Pair — design directions</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Preview shell: switches between the two live directions in an iframe.
     Each version stays a standalone page — final/index.html and v2/index.html open on their own too. -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bar:#16201A;      /* neutral dark shell, so neither direction's palette wins */
    --bar-2:#1E2A22;
    --text:#EFEDE6;
    --text-60:rgba(239,237,230,.62);
    --line:rgba(239,237,230,.16);
    --on:#EFEDE6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bar);color:var(--text);font-family:"Hanken Grotesk",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  .bar{display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;flex:none;
    border-bottom:1px solid var(--line);background:var(--bar)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{display:block;width:44px;height:26px;flex:none;background:var(--text);
    -webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat}
  .brand b{font-size:14.5px;font-weight:700;white-space:nowrap}
  .brand span{font-size:12.5px;color:var(--text-60);white-space:nowrap}
  .spacer{flex:1}
  /* segmented switcher */
  .seg{display:flex;gap:4px;background:var(--bar-2);border:1px solid var(--line);border-radius:100px;padding:4px}
  .seg button{appearance:none;border:none;background:none;cursor:pointer;color:var(--text-60);
    font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:100px;min-height:36px;
    white-space:nowrap;transition:background .18s ease,color .18s ease}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--on);color:#16201A}
  .open{font-size:13px;color:var(--text-60);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    padding:8px 10px;border-radius:8px;text-decoration:none;transition:color .18s ease}
  .open:hover{color:var(--text)}
  :focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:8px}
  /* frame */
  .stage{flex:1;position:relative;background:#fff;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  @media(max-width:640px){
    .bar{height:52px;padding:0 12px;gap:10px}
    .brand span,.open span{display:none}
    .brand b{font-size:13px}
    .seg button{padding:8px 13px;font-size:13px}
  }
  @media(max-width:380px){.brand b{display:none}}
</style>
</head>
<body>

<header class="bar">
  <span class="brand">
    <span class="logo" role="img" aria-label="The Handy Pair logo"></span>
    <b>The Handy Pair</b><span>· design directions</span>
  </span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Choose a design direction">
    <button type="button" data-v="final" aria-pressed="true">Final</button>
    <button type="button" data-v="v2" aria-pressed="false">V2</button>
  </div>
  <a class="open" id="openTab" href="final/index.html" target="_blank" rel="noopener" title="Open this version in a new tab">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3M9.5 2H14v4.5M14 2L7.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Open</span>
  </a>
</header>

<div class="stage">
  <iframe id="frame" src="final/index.html" title="Live preview of the selected design direction"></iframe>
</div>

<script>
(function(){
  var SRC={final:'final/index.html',v2:'v2/index.html'};
  var frame=document.getElementById('frame'),openTab=document.getElementById('openTab');
  var buttons=[].slice.call(document.querySelectorAll('.seg button'));

  function show(v,push){
    if(!SRC[v]) v='final';
    frame.src=SRC[v];
    openTab.href=SRC[v];
    buttons.forEach(function(b){b.setAttribute('aria-pressed', b.dataset.v===v);});
    try{localStorage.setItem('thp-version',v);}catch(e){}
    if(push){
      var u=new URL(location.href); u.searchParams.set('v',v);
      history.replaceState(null,'',u);
    }
    document.title='The Handy Pair — '+(v==='v2'?'V2':'Final');
  }

  buttons.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v,true);});});

  /* ?v= wins over the remembered choice, so a shared link always lands where intended */
  var fromUrl=new URLSearchParams(location.search).get('v');
  var saved=null; try{saved=localStorage.getItem('thp-version');}catch(e){}
  show(fromUrl||saved||'final',false);
})();
</script>
</body>
</html>
